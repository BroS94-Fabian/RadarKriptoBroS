name: Uji Pilihan Harian

on:
  workflow_dispatch:
    inputs:
      tahap:
        description: "semua = hitung ulang data harian (±15 menit) · model = uji dari data tersimpan"
        default: "semua"
      mulai:
        description: "Data mulai (YYYY-MM-DD)"
        default: "2020-01-01"

permissions:
  contents: write

concurrency:
  group: radar-uji-pilihan
  cancel-in-progress: false

jobs:
  uji:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAHAP: ${{ github.event.inputs.tahap || 'semua' }}
      MULAI: ${{ github.event.inputs.mulai || '2020-01-01' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Analisa tiap koin tiap hari
        if: env.TAHAP != 'model'
        run: python backtest_pilihan.py data --mulai "$MULAI"

      - name: Simpan data ke cabang data-pilihan
        if: env.TAHAP != 'model'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w backtest_pilihan/harian.csv.gz)
          t1=$(printf '100644 blob %s\tharian.csv.gz\n' "$blob" | git mktree)
          t2=$(printf '040000 tree %s\tbacktest_pilihan\n' "$t1" | git mktree)
          c=$(git commit-tree "$t2" -m "data pilihan harian $(date -u +%F)")
          git push -f origin "$c:refs/heads/data-pilihan"

      - name: Ambil data tersimpan
        if: env.TAHAP == 'model'
        run: |
          git fetch --depth 1 origin data-pilihan
          mkdir -p backtest_pilihan
          git show FETCH_HEAD:backtest_pilihan/harian.csv.gz > backtest_pilihan/harian.csv.gz

      - name: Uji aturan pilihan harian
        run: python backtest_pilihan.py model

      - name: Simpan hasil
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_pilihan/ || exit 0
          git commit -m "uji pilihan harian: perbarui hasil" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
