name: Radar Whale Kripto

on:
  schedule:
    - cron: "7 * * * *"   # tiap jam di menit ke-7 (waktu UTC; tetap tiap jam di WIB)
  workflow_dispatch:       # tombol "Run workflow" untuk jalan manual
    inputs:
      mode:
        description: "Mode jalan"
        type: choice
        options: [normal, tes-telegram, demo]
        default: normal

permissions:
  contents: write          # untuk menyimpan state.json (anti alert dobel)

concurrency:
  group: radar-whale
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Jalankan radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: python scanner.py --mode "$MODE"

      - name: Simpan state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "radar: update state"
            git push || (git pull --rebase && git push)
          fi
