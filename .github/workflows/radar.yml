name: Radar Whale Kripto

on:
  schedule:
    - cron: "7 * * * *"   # tiap jam di menit ke-7
  workflow_dispatch:       # tombol "Run workflow" untuk jalan manual
    inputs:
      mode:
        description: "Mode jalan"
        type: choice
        options: [normal, tes-telegram, demo]
        default: normal

permissions:
  contents: write          # simpan state.json (anti alert dobel)
  pages: write             # terbitkan dashboard ke GitHub Pages
  id-token: write

concurrency:
  group: radar-whale
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Jalankan radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: python scanner.py --mode "$MODE"

      - name: Simpan state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "radar: update state"
            git push || (git pull --rebase && git push)
          fi

      - name: Siapkan dashboard
        if: (github.event.inputs.mode || 'normal') == 'normal' && hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  dashboard:
    needs: scan
    if: needs.scan.result == 'success' && (github.event.inputs.mode || 'normal') == 'normal'
    runs-on: ubuntu-24.04
    continue-on-error: true   # kalau GitHub Pages belum diaktifkan, radar tetap dianggap sukses
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
