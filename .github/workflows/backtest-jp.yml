name: Backtest Jangka Pendek

on:
  workflow_dispatch:
    inputs:
      hari:
        description: "Jumlah hari data candle 1 jam"
        default: "730"
      koin:
        description: "Jumlah koin (top CMC, bukan meme)"
        default: "100"

permissions:
  contents: write

concurrency:
  group: radar-backtest-jp
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Jalankan backtest jangka pendek
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python backtest_jp.py --hari "${{ github.event.inputs.hari || '730' }}" --maks-koin "${{ github.event.inputs.koin || '100' }}"

      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_jp/
          git commit -m "backtest jangka pendek: perbarui hasil" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
