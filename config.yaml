# =====================================================================
#  PENGATURAN RADAR KRIPTO
#  Ubah angka di bawah lewat GitHub (klik file ini > ikon pensil > Commit).
#  Perubahan berlaku otomatis pada putaran berikutnya.
# =====================================================================

# Daftar koin: 200 terbesar menurut market cap.
#   coinmarketcap = butuh secret CMC_API_KEY (gratis). Kalau belum ada,
#                   otomatis pakai CoinGecko sebagai cadangan.
#   coingecko     = tanpa key.
sumber_ranking: coinmarketcap
top_n: 200
ranking_refresh_jam: 6          # daftar top 200 diperbarui tiap 6 jam

# Bursa sumber candle (urutan = prioritas). Koin yang tidak ada di Binance dicari di OKX.
bursa: [binance, okx]
quote: USDT
min_volume_24j_usd: 300000      # pasangan USDT yang terlalu sepi diabaikan

# Koin tambahan yang ingin diabaikan, contoh: [XRP, DOGE]
# (stablecoin & token pembungkus seperti USDT, USDC, WBTC, stETH sudah otomatis diabaikan)
abaikan: []

# ---- Klasifikasi ----
# Skor 0-100 dihitung terpisah untuk "naik" dan "turun" dari:
#   volume/akumulasi 20 · lokasi harga 15 · pola grafik 25 · momentum (MACD/RSI/Stoch) 20
#   candlestick 8 · tren & MA 10 · Bollinger squeeze 5 · Elliott 6
skor_min: 55                    # skor minimal untuk 🟢 POTENSI NAIK / 🔴 POTENSI TURUN (backtest: ≥55 jauh lebih baik)
selisih_min: 15                 # skor arah itu harus unggul minimal sekian dari arah lawan
skor_pantau: 40                 # 🟡 PANTAU (hanya di dashboard, tidak dikirim ke Telegram)
syarat_akumulasi: true          # 🟢 wajib ada bukti akumulasi (OBV/CMF/beli agresif)
maks_naik_7h_persen: 20         # koin yang sudah naik >20% dalam 7 hari tidak dianggap "masih di bawah"
kirim_alert_turun: false        # alert 🔴 potensi turun (backtest: hasilnya minus → dimatikan; tetap tampil di dashboard)

# ---- Filter sinyal (lihat hasil uji di dashboard tab 🧪 Backtest) ----
# Pengaturan di bawah = kombinasi terbaik backtest Okt 2024–Okt 2026 (87 sinyal):
#   sinyal naik hanya saat BTC tren naik + bukan meme coin + skor ≥55
#   → menang 71%, rata-rata bersih +3,0% per sinyal, rugi terburuk −12%.
# filter_pasar: true   = sinyal naik ditahan saat BTC tren turun (di bawah MA50 & MA50 menurun),
#                        sinyal turun ditahan saat BTC tren naik
#               ketat  = sinyal naik HANYA saat BTC tren naik
#               false  = tanpa filter pasar
filter_pasar: ketat
# filter_meme:  ketat   = meme coin butuh skor naik minimal skor_min + 10
#               abaikan = meme coin tidak pernah dijadikan sinyal naik
#               false   = tanpa filter
filter_meme: abaikan
wajib_breakout: false           # true = sinyal hanya bila pola sudah breakout
min_rr: 0                       # rasio TP2 : SL minimal (0 = tidak dicek)

# ---- Siklus 4 stage (Stage 1 Dasar → 2 Naik → 3 Puncak → 4 Turun) ----
# Stage tiap koin selalu ditampilkan (Telegram, grafik, dashboard tab 🔄 Siklus).
# Filter di bawah ini membatasi sinyal berdasarkan stage. Isi dengan nomor stage dan/atau kode fase:
#   1, 2, 3, 4  atau  "1-akhir", "1→2", "2-awal", "2", "2-jenuh", "3", "3-akhir", "3→4", "4-awal", "4"
#   contoh: filter_stage_naik: [1, 2]   → sinyal naik hanya bila koin di Stage 1 atau 2
#   []  = tidak difilter
filter_stage_naik: []
filter_stage_turun: []
min_checklist: 0                # minimal butir checklist yang cocok (Siklus, Tren, S&R, Pola, Candle, Volume), 0 = tidak dicek

# ---- Rencana jual untuk setiap sinyal ----
# TP1 = ambil untung sebagian, lalu stop loss sisa posisi dipindah ke harga beli.
# TP2 = target pola (kalau tidak ada: 2x jarak TP1). SL = yang lebih dekat antara batas batal pola & sl.
# Pilihan dari backtest (dengan filter di atas):
#   porsi_tp1 0.5, tp1 5%, sl 12%  → menang 71%, rata-rata +3,0%, rugi terburuk −12%   (bawaan: sukses rate tinggi)
#   porsi_tp1 0,   sl 12%          → menang 54%, rata-rata +6,3%, rugi terburuk −12%   (untung rata-rata lebih besar)
rencana:
  mode: persen                  # persen | atr (jarak berdasarkan volatilitas koin)
  tp1_persen: 5
  sl_persen: 12
  tp1_atr: 1.5
  sl_atr: 1.5
  porsi_tp1: 0.5                # 0.5 = jual 50% di TP1; 1 = jual semua di TP1; 0 = langsung ke TP2
  maks_hari: 30                 # posisi ditutup bila tidak kena apa pun dalam X hari

biaya:
  fee_beli_persen: 0.1
  fee_jual_persen: 0.1
  pajak_jual_persen: 0.21

# ---- Telegram ----
cooldown_jam: 12                # koin yang sama tidak dikirim ulang selama X jam
maks_grafik_per_run: 6          # maks. alert bergrafik per putaran (sisanya daftar singkat)
ringkasan_harian_jam_wib: 8     # ringkasan harian dikirim sekali sehari mulai jam ini

# ---- Dashboard ----
maks_grafik_dashboard: 40
url_dashboard: ""               # kosongkan = otomatis https://<username>.github.io/<repo>/

# ---- Money management (opsional) ----
# Isi modal_rp untuk menampilkan ukuran posisi per sinyal: rugi bila kena SL = risiko_per_transaksi_persen x modal.
modal_rp: 0                     # contoh: 10000000 (Rp10 juta). 0 = tidak dihitung
risiko_per_transaksi_persen: 1
maks_posisi_persen: 20          # satu posisi maksimal 20% modal

# Rentang data untuk zona akumulasi (profil volume), dalam hari.
profil_volume_hari: 30
